[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paired-eval"
version = "0.4.0"
description = "Evaluate models, agents and harnesses: program checks first, rubrics for the rest, honest paired statistics."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"          # ast.unparse / math.nextafter 均为 3.9+
dependencies = []                  # 零第三方依赖是设计约束, 不是暂时状态
keywords = ["evaluation", "llm", "agent", "harness", "paired-comparison", "mutation-testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://alloevil.github.io/paired-eval/"
Repository = "https://github.com/alloevil/paired-eval"
Changelog = "https://github.com/alloevil/paired-eval/blob/main/CHANGELOG.md"

# 只分发 paired_eval 包。mutate_auto / check_hooks / build_site 是仓库内的开发工具, 不随包分发。
[tool.setuptools.packages.find]
include = ["paired_eval"]
