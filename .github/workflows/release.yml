name: release

# Publishes to public PyPI on a version tag, using PyPI Trusted Publishing (OIDC) —
# no API token is stored in this repository. One-time setup on pypi.org:
#   Your projects → paired-eval → Publishing → Add a new pending publisher
#     Owner: alloevil   Repository: paired-eval   Workflow: release.yml   Environment: pypi
# After that, `git tag v0.4.1 && git push origin v0.4.1` publishes that version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
          echo "tag matches version $version"
      - name: Run the test suite first
        run: |
          python3 -m unittest discover -s tests -t . 2>/dev/null || python3 -m pytest tests/ -q
      - run: python3 -m pip install --upgrade build
      - run: python3 -m build
      - run: python3 -m pip install --upgrade twine && python3 -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing: the OIDC token replaces an API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
