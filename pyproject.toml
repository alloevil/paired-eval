[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paired-eval"
version = "0.1.0"
description = "配对评测方法学工具箱: 模型 / agent / harness 的诚实统计比较, 附验证器谱系与自我验证层"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"          # ast.unparse / math.nextafter 均为 3.9+
dependencies = []                  # 零第三方依赖是设计约束, 不是暂时状态
keywords = ["evaluation", "llm", "agent", "harness", "paired-comparison", "mutation-testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]

# 平铺布局: 可安装的是这几个库模块。mutate_auto / check_hooks 是仓库内的开发工具, 不随包分发。
[tool.setuptools]
py-modules = ["answer_match", "claim_eval", "rubric_eval", "eval_task", "paired_bench", "reproduce_findings"]
