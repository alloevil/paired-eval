# 与 checkall.sh 的分层一致: push/PR 跑前四层(~4 分钟), 每晚跑全部五层(含约 25 分钟的变异棘轮)。
# 第六层(reproduce_findings, 需真实模型调用与 API 配额)刻意不在 CI 里 —— 见 checkall.sh 头部。
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"      # 每日 UTC 03:17: 全量, 含机械变异棘轮

jobs:
  fast-suite:
    # 第 1 层在多个版本上各跑一遍: requires-python >= 3.9(ast.unparse / math.nextafter)。
    # 第一次 CI 就在 3.12 上抓到一个 3.10 下靠舍入运气通过的浮点刀锋测试 —— 矩阵不是形式。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]   # 最低支持版 + 3.12(sum 改补偿求和的版本) + 最新
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sh runtests.sh

  checklist:
    # 第 1~4 层。check_hooks 要在临时仓库里真提交, 需要 git 身份与完整历史(pre-push 用 @{u}/HEAD~1 算改动行)
    needs: fast-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: sh checkall.sh --fast

  nightly-full:
    # 第 5 层单独放夜间: 约 25 分钟的全量变异(473 个变异点 x 3 秒套件), 每次 push 都跑既慢又无增量信息(pre-push 已用 --since 跑过改动行)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: sh checkall.sh
